# マニュアルアシスタント（統一チャット v1）— tools/build_dsl.py が生成
# 質問(qa) / 登録(register) / 一括取り込み(bulk) を決定的ルーティングで 1 入口に統合。
# 設計: docs/unified-chat-design.md。
# **直接編集せず、元 DSL とスクリプトを直して再生成する。**
#
# インポート後に環境へ合わせる箇所:
#  - LLM ノードのモデル（qa 分岐は anthropic のプレースホルダ。任意の LLM に）
#  - q_knowledge_retrieval / similar_search の dataset_ids と Reranker 設定
#  - environment_variables の DOCSTORE_URL / DOCSTORE_API_KEY
