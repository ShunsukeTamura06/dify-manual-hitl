    - data:
        code: "\nimport re\n\nDEFAULT_MAX_CHARS = 7000\n_PARAGRAPH_SEP = re.compile(r\"\
          \\n[ \\t]*\\n\")\n\n\ndef _split_paragraphs(text):\n    return [p for p\
          \ in _PARAGRAPH_SEP.split(text) if p.strip()]\n\n\ndef _hard_split(chunk,\
          \ max_chars):\n    if len(chunk) <= max_chars:\n        return [chunk]\n\
          \    pieces = []\n    buf = \"\"\n    for line in chunk.splitlines(keepends=True):\n\
          \        while len(line) > max_chars:\n            if buf:\n           \
          \     pieces.append(buf)\n                buf = \"\"\n            pieces.append(line[:max_chars])\n\
          \            line = line[max_chars:]\n        if buf and len(buf) + len(line)\
          \ > max_chars:\n            pieces.append(buf)\n            buf = \"\"\n\
          \        buf += line\n    if buf:\n        pieces.append(buf)\n    return\
          \ pieces\n\n\ndef split_into_windows(text, max_chars=DEFAULT_MAX_CHARS):\n\
          \    windows = []\n    buf = \"\"\n    for para in _split_paragraphs(text):\n\
          \        if len(para) > max_chars:\n            if buf:\n              \
          \  windows.append(buf)\n                buf = \"\"\n            windows.extend(_hard_split(para,\
          \ max_chars))\n            continue\n        candidate = para if not buf\
          \ else buf + \"\\n\\n\" + para\n        if len(candidate) > max_chars:\n\
          \            windows.append(buf)\n            buf = para\n        else:\n\
          \            buf = candidate\n    if buf:\n        windows.append(buf)\n\
          \    return windows\n\n\ndef _coerce_text(text):\n    if isinstance(text,\
          \ list):\n        return \"\\n\\n\".join(str(t) for t in text if t)\n  \
          \  if text is None:\n        return \"\"\n    return str(text)\n\n\ndef\
          \ main(text) -> dict:\n    return {\"windows\": split_into_windows(_coerce_text(text))}\n"
