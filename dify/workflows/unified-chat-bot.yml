          }\n    lines = [f\"承認待ち（status: draft）のページが {len(pages)} 件あります。\", \"\"\
          ]\n    for p in pages:\n        title = p.get(\"title\", \"\")\n       \
          \ path = p.get(\"path\", \"\")\n        url = p.get(\"viewer_url\", \"\"\
          )\n        updated = p.get(\"updated_at\", \"\")\n        lines.append(f\"\
          - {title}（{path}）\")\n        lines.append(f\"  更新: {updated} / {url}\"\
          )\n    lines.append(\"\")\n    lines.append(\"GROWI で内容を確認し、frontmatter\
          \ の status を published にすると検索に反映されます。\")\n    return {\"text\": \"\\n\"\
          .join(lines)}\n"
