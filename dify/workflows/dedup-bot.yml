          import json

          def main(body, prefix: str) -> dict:
              try:
                  d = json.loads(body) if isinstance(body, str) else (body or {})
              except Exception:
                  d = {}
              pages = d.get("pages", []) if isinstance(d, dict) else []
              prefix = prefix or "/manuals"
              ids = []
              metas = []
              for p in pages:
                  if not isinstance(p, dict):
                      continue
                  path = str(p.get("path", ""))
                  pid = str(p.get("id", ""))
                  if not pid or not path.startswith(prefix):
                      continue
                  ids.append(pid)
                  metas.append({"id": pid, "title": str(p.get("title", "")), "path": path})
              return {"page_ids": ids, "metas": metas}
        code_language: python3
