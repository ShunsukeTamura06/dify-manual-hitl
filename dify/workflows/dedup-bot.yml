        code_language: python3
        code: "\nimport json\n\n\ndef main(\n    target_page_id: str, path: str, title:\
          \ str, content: str,\n    completeness_ok, completeness_warnings,\n) ->\
          \ dict:\n    completeness_ok = bool(completeness_ok)\n    lines = content.split(\"\
          \\n\")\n    if lines and lines[0].strip() == \"---\":\n        try:\n  \
          \          end = lines[1:].index(\"---\") + 1\n        except ValueError:\n\
          \            end = -1\n        if end > 0:\n            fm = [ln for ln\
          \ in lines[1:end] if not ln.strip().startswith(\"status:\")]\n         \
          \   fm.append(\"status: draft\")\n            content = \"\\n\".join([\"\
          ---\"] + fm + lines[end:])\n    else:\n        content = \"---\\nstatus:\
          \ draft\\n---\\n\" + content\n\n    if not completeness_ok:\n        detail\
          \ = \"\\n\".join(f\"> - {w}\" for w in (completeness_warnings or []))\n\
          \        banner = (\n            \"> ⚠️ **完全性チェック警告**: 統合元ページの内容が一部欠落している\"\
          \n            \"可能性があります。公開前に必ず原文と見比べてご確認ください。\\n\"\n            f\"{detail}\\\
          n\\n\"\n        )\n        # frontmatter (---...---) の直後にバナーを挿入する\n    \
          \    lines2 = content.split(\"\\n\")\n        if lines2 and lines2[0].strip()\
          \ == \"---\":\n            try:\n                end2 = lines2[1:].index(\"\
          ---\") + 1\n                content = \"\\n\".join(lines2[: end2 + 1]) +\
          \ \"\\n\\n\" + banner + \"\\n\".join(lines2[end2 + 1:])\n            except\
          \ ValueError:\n                content = banner + content\n        else:\n\
          \            content = banner + content\n\n    body = json.dumps({\n   \
          \     \"target_page_id\": target_page_id or \"\",\n        \"path\": path,\
          \ \"title\": title,\n        \"content\": content, \"metadata\": {},\n \
          \   }, ensure_ascii=False)\n    return {\"body\": body}\n"
        outputs:
