    - data:
        code: "\nimport json\nimport re\n\n\ndef main(md: str, fallback_title: str) -> dict:\n\
        \    md = md or \"\"\n    path = \"\"\n    title = \"\"\n    m = re.search(r\"^path:\\s*(.+)$\", md, re.MULTILINE)\n\
