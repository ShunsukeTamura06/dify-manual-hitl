          ]\n            else:\n                merged.append({\"title\": page[\"\
          title\"], \"content\": page[\"content\"]})\n        prev_dangling = bool(pages)\
          \ and pages[-1][\"incomplete\"]\n    return {\"pages\": merged}\n"
