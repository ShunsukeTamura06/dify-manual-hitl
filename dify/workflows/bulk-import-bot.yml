    - data:
        code: |

          import json


          def main(results: list, expected: list) -> dict:
              results = results or []
              expected = expected or []
              lines = []
              ok = 0
              for r in results:
                  title = ""
                  try:
                      d = json.loads(r) if isinstance(r, str) else r
                      if isinstance(d, dict):
                          title = d.get("title") or d.get("path") or ""
                          if d.get("viewer_url") or d.get("id"):
                              ok += 1
                  except Exception:
                      pass
                  if title:
                      lines.append("- " + str(title))
              total = len(expected)
              head = str(ok) + " / " + str(total) + " ページを作成しました。"
              if ok < total:
                  head += "（" + str(total - ok) + " 件は作成に失敗しました。再実行で未作成分を補完できます）"
              text = head + "\n" + "\n".join(lines)
              return {"text": text}

        code_language: python3
        desc: 作成結果を集計
        outputs:
          text:
            children: null
            type: string
        selected: false
        title: 集計
        type: code
        variables:
        - value_selector:
          - iter_reduce
          - output
          variable: results
        - value_selector:
          - merge_pages
          - pages
          variable: expected
