        retrieval_mode: multiple
        title: 類似ページ検索
        type: knowledge-retrieval
      id: similar_search
      position:
        x: 1060
        y: 460
      positionAbsolute:
        x: 1060
        y: 460
      type: custom
    - data:
        code: "\ndef main(items: list) -> dict:\n    seen = {}\n    for r in (items\
          \ or []):\n        meta = r.get(\"metadata\", {}) or {}\n        name =\
          \ meta.get(\"document_name\", \"\") or r.get(\"title\", \"\")\n        title\
          \ = name.split(\"::\", 1)[1] if \"::\" in name else name\n        score\
          \ = meta.get(\"score\") or 0\n        if title and title not in seen:\n\
          \            seen[title] = score\n    if not seen:\n        return {\"text\"\
          : \"（内容が近い既存ページは見つかりませんでした）\"}\n    lines = []\n    for t, s in sorted(seen.items(),\
          \ key=lambda x: -x[1]):\n        lines.append(f\"- {t}（類似度 {round(s*100)}%）\"\
          )\n    return {\"text\": \"\\n\".join(lines)}\n"
        code_language: python3
        outputs:
          text:
            type: string
        title: 類似ページ整形
        type: code
        variables:
        - value_selector:
          - similar_search
          - result
          variable: items
