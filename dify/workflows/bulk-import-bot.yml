    - data:
        code: |

          import json


          def _coerce_pages(window_result):
              data = window_result
              if isinstance(window_result, str):
                  text = window_result.strip()
                  if not text:
                      return []
                  try:
                      data = json.loads(text)
                  except Exception:
                      start = text.find("[")
                      end = text.rfind("]")
                      if start == -1 or end <= start:
                          return []
                      try:
                          data = json.loads(text[start:end + 1])
                      except Exception:
                          return []
              if isinstance(data, dict):
                  data = [data]
              if not isinstance(data, list):
                  return []
              pages = []
              for item in data:
                  if not isinstance(item, dict):
                      continue
                  pages.append({
                      "title": str(item.get("title", "")).strip(),
                      "content": str(item.get("content", "")),
                      "continues_previous": bool(item.get("continues_previous", False)),
                      "incomplete": bool(item.get("incomplete", False)),
                  })
              return pages


          def _normalize_title(t):
              return " ".join(t.split())


          def main(window_results: list) -> dict:
              merged = []
              prev_dangling = False
              for result in (window_results or []):
                  pages = _coerce_pages(result)
                  for i, page in enumerate(pages):
                      at_boundary = i == 0
                      same_title = (at_boundary and bool(merged) and bool(page["title"])
                                    and _normalize_title(merged[-1]["title"]) == _normalize_title(page["title"]))
                      join = bool(merged) and (page["continues_previous"]
                                               or (at_boundary and prev_dangling) or same_title)
                      if join:
                          tail = merged[-1]
                          tail["content"] = tail["content"].rstrip() + "\n\n" + page["content"].lstrip()
                          if not tail["title"] and page["title"]:
                              tail["title"] = page["title"]
                      else:
                          merged.append({"title": page["title"], "content": page["content"]})
                  prev_dangling = bool(pages) and pages[-1]["incomplete"]
              return {"pages": merged}

        code_language: python3
