app:
  description: マニュアル質問Bot (Phase 1a). 社内マニュアルから回答を引用付きで返す。
  icon: 📚
  icon_background: '#FFEAD5'
  mode: advanced-chat
  name: マニュアル質問Bot
  use_icon_as_answer_icon: false
kind: app
version: 0.1.5
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: |
      マニュアルに関する質問をどうぞ。
      回答は必ず出典付きでお返しします。「該当情報なし」の場合もその旨お伝えします。
    retriever_resource:
      enabled: true   # 引用元をチャットに表示
    sensitive_word_avoidance:
      enabled: false
    suggested_questions:
      - 経費精算の上限額は？
      - 海外出張の手続きを教えて
      - 勤怠の修正方法は？
    suggested_questions_after_answer:
      enabled: true
    speech_to_text:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
      - id: start-to-retrieval
        source: start
        target: knowledge_retrieval
        sourceHandle: source
        targetHandle: target
        type: custom
      - id: retrieval-to-staleness
        source: knowledge_retrieval
        target: staleness
        sourceHandle: source
        targetHandle: target
        type: custom
      - id: staleness-to-llm
        source: staleness
        target: llm
        sourceHandle: source
        targetHandle: target
        type: custom
      - id: llm-to-answer
        source: llm
        target: answer
        sourceHandle: source
        targetHandle: target
        type: custom
    nodes:
      # ── 開始ノード ──
      - id: start
        type: custom
        data:
          type: start
          title: 開始
          variables: []
        position: {x: 80, y: 282}

      # ── ナレッジ検索ノード ──
      - id: knowledge_retrieval
        type: custom
        data:
          type: knowledge-retrieval
          title: マニュアル検索
          query_variable_selector: [sys, query]
          dataset_ids:
            - "REPLACE_WITH_YOUR_DATASET_ID"   # ← Step 1で作ったナレッジのID
          retrieval_mode: multiple
          multiple_retrieval_config:
            top_k: 10           # Rerank前に広めに取る
            score_threshold: 0.3
            score_threshold_enabled: true
            reranking_enable: true
            reranking_mode: reranking_model
            reranking_model:
              provider: "REPLACE_WITH_RERANKER_PROVIDER"   # 例: huggingface_hub / cohere
              model: "REPLACE_WITH_RERANKER_MODEL"         # 例: BAAI/bge-reranker-v2-m3
        position: {x: 380, y: 282}

      # ── 古さ判定ノード（読込時の透明性。architecture.md の設計） ──
      # 検索結果each chunk の本文冒頭には sync が埋め込んだ「最終更新:{ISO日時}」
      # ヘッダ（services/sync/app/naming.py build_source_header）が既に入っている。
      # 経過日数の計算は決定的に Code で行い、古い場合は注記をチャンクへ追記して
      # LLM に渡す（日付計算を LLM の不確かな推論に委ねない）。
      - id: staleness
        type: custom
        data:
          type: code
          title: 古さ判定
          code_language: python3
          code: |
            import re
            from datetime import datetime, timezone

            # 「最終更新から何日経過したら注記するか」。半年を既定とする。
            STALENESS_DAYS = 180
            _STALE_RE = re.compile(r"最終更新:(\S+)")


            def main(items: list) -> dict:
                now = datetime.now(timezone.utc)
                chunks = []
                for r in (items or []):
                    content = str(r.get("content", ""))
                    note = ""
                    m = _STALE_RE.search(content)
                    if m:
                        raw = m.group(1).rstrip("/")
                        try:
                            dt = datetime.fromisoformat(raw.replace("Z", "+00:00"))
                            if dt.tzinfo is None:
                                dt = dt.replace(tzinfo=timezone.utc)
                            days = (now - dt).days
                            if days >= STALENESS_DAYS:
                                note = (
                                    f"\n> ⚠️ この情報は最終更新から{days}日以上経過しています。"
                                    "最新か確認してください。"
                                )
                        except ValueError:
                            pass
                    chunks.append(content + note)
                return {"context": "\n\n---\n\n".join(chunks)}
          outputs:
            context:
              type: string
          variables:
            - variable: items
              value_selector: [knowledge_retrieval, result]
        position: {x: 530, y: 282}

      # ── LLM (Claude) ノード ──
      - id: llm
        type: custom
        data:
          type: llm
          title: 回答生成 (Claude)
          model:
            provider: anthropic
            name: claude-sonnet-4-5-20250929   # ← 利用可能な最新の Claude モデル名に
            mode: chat
            completion_params:
              temperature: 0.1          # 決定性重視
              max_tokens: 2000
          prompt_template:
            - role: system
              text: |
                あなたは社内マニュアルに基づいて質問に答えるアシスタントです。

                # 厳守ルール
                1. 提供された「コンテキスト」の情報のみを使って回答する。コンテキストに無い情報は推測しない。
                2. 該当情報が無い・不十分な場合は、明確に「該当する情報がマニュアルに見当たりません」と回答する。憶測で補わない。
                3. 回答には必ず**出典**を含める。出典はマニュアル名と該当箇所を明記する。
                4. 複数のコンテキストで矛盾する記述がある場合、矛盾を隠さず両方提示し、どちらが新しいか/正しいかを確認するよう促す。
                5. コンテキストの各チャンクには「最終更新:{日時}」が付いている。回答の根拠にした
                   チャンクの最終更新日を出典に必ず併記する（読込時の透明性。日付そのものを
                   加工・推測しない。書かれている値をそのまま使う）。
                6. コンテキストに「⚠️ この情報は最終更新から○日以上経過しています」という注記が
                   付いているチャンクを使った場合は、注意・補足でその旨をそのまま伝え、
                   「最新か原典（出典URL）で確認してください」と促す。日数の判定は既に済んでいる
                   ので、自分で経過日数を計算・推測しない。

                # 出力形式
                ## 回答
                （簡潔に。長くても5-7文程度。手順なら番号付き）

                ## 出典
                - {マニュアル名}（最終更新: {日時}）: {該当箇所の要約}
                - ...

                ## 注意・補足
                （矛盾、古さの注記、不確実性、確認が必要な点があれば）
            - role: user
              text: |
                # コンテキスト
                {{#staleness.context#}}

                # 質問
                {{#sys.query#}}
          context:
            enabled: false
            variable_selector: []
          vision:
            enabled: false
        position: {x: 680, y: 282}

      # ── 回答ノード ──
      - id: answer
        type: custom
        data:
          type: answer
          title: 回答
          answer: "{{#llm.text#}}"
        position: {x: 980, y: 282}
