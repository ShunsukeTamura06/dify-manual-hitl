    - data:
        code: |

          import json
          import difflib

          HIGH_OVERLAP = 0.8
          CANDIDATE_OVERLAP = 0.5
          TITLE_AGREE_OVERLAP = 0.5

          def _norm(text):
              return " ".join((text or "").split())

          def overlap_ratio(a, b):
              return difflib.SequenceMatcher(None, _norm(a), _norm(b)).ratio()

          def cluster_min_overlap(texts):
              if len(texts) < 2:
                  return 1.0
              worst = 1.0
              for i in range(len(texts)):
                  for j in range(i + 1, len(texts)):
                      worst = min(worst, overlap_ratio(texts[i], texts[j]))
              return worst

          def _build_clusters(ids, pairs, min_score):
              parent = {i: i for i in ids}
              def find(x):
                  while parent[x] != x:
                      parent[x] = parent[parent[x]]
                      x = parent[x]
                  return x
              def union(a, b):
                  ra, rb = find(a), find(b)
                  if ra != rb:
                      parent[ra] = rb
              for a, b, score in pairs:
                  if a in parent and b in parent and score >= min_score:
                      union(a, b)
              groups = {}
              for i in ids:
                  groups.setdefault(find(i), []).append(i)
              clusters = [g for g in groups.values() if len(g) >= 2]
              clusters.sort(key=lambda g: ids.index(g[0]))
              return clusters

          def titles_similarity(titles):
              norm = [_norm(t) for t in titles if _norm(t)]
              if len(norm) < 2:
                  return 1.0
              total, count = 0.0, 0
              for i in range(len(norm)):
                  for j in range(i + 1, len(norm)):
                      total += difflib.SequenceMatcher(None, norm[i], norm[j]).ratio()
                      count += 1
              return total / count

          def classify_confidence(min_overlap, titles_agree):
              if min_overlap >= HIGH_OVERLAP and titles_agree:
                  return "high"
              return "review"

          def build_proposals(pages, pairs, min_score):
              by_id = {str(p.get("id", "")): p for p in pages}
              ids = [str(p.get("id", "")) for p in pages]
              clusters = _build_clusters(ids, pairs, min_score)
              proposals = []
              for n, cluster in enumerate(clusters, start=1):
                  members = [by_id[i] for i in cluster if i in by_id]
                  texts = [str(m.get("content", "")) for m in members]
                  titles = [str(m.get("title", "")) for m in members]
                  min_ov = cluster_min_overlap(texts)
                  titles_agree = titles_similarity(titles) >= TITLE_AGREE_OVERLAP
                  confidence = classify_confidence(min_ov, titles_agree)
                  rep = max(members, key=lambda m: len(str(m.get("content", ""))))
                  proposals.append({
                      "cluster_id": n,
                      "page_ids": [str(m.get("id", "")) for m in members],
                      "titles": titles,
                      "representative_title": str(rep.get("title", "")),
                      "representative_path": str(rep.get("path", "")),
                      "min_overlap": round(min_ov, 3),
                      "confidence": confidence,
                      "lane": "bulk" if confidence == "high" else "individual",
                  })
              return proposals

          def candidate_pairs_from_content(pages, threshold):
              ids = [str(p.get("id", "")) for p in pages]
              texts = [str(p.get("content", "")) for p in pages]
              pairs = []
              for i in range(len(pages)):
                  for j in range(i + 1, len(pages)):
                      ratio = overlap_ratio(texts[i], texts[j])
                      if ratio >= threshold:
                          pairs.append((ids[i], ids[j], ratio))
              return pairs

          def main(metas, contents) -> dict:
              metas = metas or []
              contents = contents or []
              pages = []
              for i, m in enumerate(metas):
                  raw = contents[i] if i < len(contents) else ""
                  try:
                      cj = json.loads(raw) if isinstance(raw, str) else (raw or {})
                  except Exception:
                      cj = {}
                  content = cj.get("content", "") if isinstance(cj, dict) else ""
                  pages.append({
                      "id": str(m.get("id", "")),
                      "title": str(m.get("title", "")),
                      "path": str(m.get("path", "")),
                      "content": str(content),
                  })
              pairs = candidate_pairs_from_content(pages, CANDIDATE_OVERLAP)
              return {"proposals": build_proposals(pages, pairs, CANDIDATE_OVERLAP)}
        code_language: python3
        desc: 本文総当たりで候補ペア→クラスタ→確信度→提案を組み立てる
        outputs:
          proposals:
            children: null
            type: array[object]
        selected: false
        title: 重複提案を組み立て
