openapi: 3.1.0
info:
  title: DocStore Adapter API
  version: 0.1.0
  description: |
    Wiki 実装を隠蔽する統一インターフェース。
    GROWI / Confluence / Notion / Filesystem 等の実装はこの契約を満たす。

    呼び出し側（Sync Service、登録 Bot 等）は Wiki 実装を知らずに動く。

    このファイルが「真実の契約」。実装より先にここを更新する。

    認証（オプトイン）: Adapter 側でキーを設定した場合、/health を除く
    全エンドポイントで `X-API-Key` ヘッダを要求する（不一致は 401）。
    キー未設定なら認証なし（ローカル開発用）。

servers:
  - url: http://localhost:8001
    description: ローカル開発
  - url: http://{adapter-host}:8001
    description: 本番（環境ごとに変わる）
    variables:
      adapter-host:
        default: docstore-adapter

tags:
  - name: pages
    description: ページ CRUD
  - name: changes
    description: 変更検知（同期用）
  - name: meta
    description: ヘルス・メタ情報

paths:
  /pages:
    get:
      tags: [pages]
      summary: ページ一覧を取得（軽量版）
      parameters:
        - name: path_prefix
          in: query
          schema: { type: string }
          description: パスのプレフィックスで絞り込み（例 /manuals/経理/）
        - name: status
          in: query
          schema: { type: string, enum: [published, draft, deprecated] }
          description: |
            metadata.status での絞り込み（best-effort）。一覧 API が本文を返さない
            Wiki（GROWI 等）では metadata を判定できず絞り込めない。また絞り込みは
            ページング後に適用されるため、確実なフィルタが必要な呼び出し側
            （Sync Service 等）は各ページ取得後に自前で判定すること。
        - name: cursor
          in: query
          schema: { type: string }
          description: ページネーション用カーソル
        - name: limit
          in: query
          schema: { type: integer, default: 100, maximum: 500 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageList' }

    post:
      tags: [pages]
      summary: ページ新規作成
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PageCreateRequest' }
      responses:
        '201':
          description: 作成成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Page' }
        '409':
          description: パス重複
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /pages/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
        description: Adapter 固有のページ ID（不透明な文字列）

    get:
      tags: [pages]
      summary: ページ取得（本文付き）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Page' }
        '404':
          description: 該当なし

    put:
      tags: [pages]
      summary: ページ全置換更新
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PageUpdateRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Page' }
        '404':
          description: 該当なし
        '409':
          description: 楽観ロック衝突（expected_version 不一致）

    delete:
      tags: [pages]
      summary: ページ削除
      responses:
        '204':
          description: 削除成功
        '404':
          description: 該当なし

  /pages/upsert:
    post:
      tags: [pages]
      summary: 作成 or 更新（単一書込経路）
      description: |
        target_page_id があれば更新、無ければ path に新規作成する。
        登録 Bot のチャットフローに分岐を持たせず一直線にするためのエンドポイント
        （作成/更新の判断を Adapter 側に寄せる）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpsertRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Page' }
        '404':
          description: 更新対象が見つからない
        '409':
          description: パス重複（新規作成時）

  /pages/pending-approval:
    get:
      tags: [pages]
      summary: 承認待ち（status: draft）のページ一覧（HITL 運用の可視化用）
      description: |
        `GET /pages?status=` は一覧 API が本文を返さないため best-effort で機能しない
        （list の frontmatter 抽出は空になりがち）。本エンドポイントは候補ページを
        1 件ずつ本文取得して実際の status を確認し、draft のみ返す。
        退役（deprecated）は対応不要なので含めない。
      parameters:
        - name: path_prefix
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 100, maximum: 500 }
          description: 走査対象（一覧取得の上限）。返る draft 件数の上限ではない。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageList' }

  /pages/deprecate:
    post:
      tags: [pages]
      summary: 複数ページを退役する（重複統合の実行用）
      description: |
        指定ページを status: deprecated にし、本文冒頭に統合先へのリンクを追記する。
        即削除でなく退役に留める（原典を破壊しない・戻せる）。退役ページは sync が
        Dify に同期しない（検索から消える）。冪等: 既に deprecated でも再実行して無害。
        重複排除 Bot の統合実行フローが、統合先へマージした後に重複元を退役させる。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [page_ids]
              properties:
                page_ids:
                  type: array
                  items: { type: string }
                redirect_path:
                  type: string
                  description: 統合先パス（退役ページ本文にリンクとして追記）
      responses:
        '200':
          description: OK（一部失敗しても errors に記録し全体は止めない）
          content:
            application/json:
              schema:
                type: object
                properties:
                  deprecated:
                    type: array
                    items: { type: string }
                  errors:
                    type: array
                    items: { type: string }

  /pages/get-content:
    post:
      tags: [pages]
      summary: 既存ページ本文の取得（マージ用）
      description: |
        page_id が空、または見つからない場合は exists=false / content="" を返す
        （登録 Bot の「新規」ケースでもエラーにせず呼べる）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                page_id: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GetContentResponse' }

  /pages/changes:
    get:
      tags: [changes]
      summary: 指定時刻以降に変更があったページの一覧
      description: |
        Sync Service が定期バッチで呼ぶ。
        webhook が取りこぼした変更を補修するための保険ルート。

        イベント種別の保証は Adapter の能力に依存する（best-effort）:
        - GROWI Adapter は現状 `updated` のみ返す（GROWI の recent API が
          削除・移動を報告しないため。作成も `updated` として現れる）。
        - したがって **削除・移動の反映は full 同期（全件突合）が担保する**。
          diff 同期だけを回し続けない運用にすること（例: 日次で full を併用）。
      parameters:
        - name: since
          in: query
          required: true
          schema: { type: string, format: date-time }
          description: この時刻以降の変更を返す
        - name: include_deleted
          in: query
          schema: { type: boolean, default: true }
          description: |
            deleted イベントを含めるか。Adapter が削除検知に対応しない場合
            （GROWI 等）は無視される（best-effort）。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  changes:
                    type: array
                    items: { $ref: '#/components/schemas/ChangeEvent' }
                  next_since:
                    type: string
                    format: date-time

  /health:
    get:
      tags: [meta]
      summary: ヘルスチェック
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok, degraded] }
                  wiki_reachable: { type: boolean }

  /info:
    get:
      tags: [meta]
      summary: Adapter のメタ情報
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  adapter_name: { type: string, example: growi }
                  adapter_version: { type: string, example: 0.1.0 }
                  wiki_type: { type: string, example: GROWI }
                  capabilities:
                    type: array
                    items:
                      type: string
                      enum: [create, update, delete, search, attachments, webhooks]

components:
  schemas:
    Page:
      type: object
      required: [id, path, title, content, content_format, version, updated_at, viewer_url]
      properties:
        id:
          type: string
          description: Adapter 固有の不透明 ID。呼び出し側はこの中身を解釈しない
        path:
          type: string
          description: 論理パス（例 /manuals/経理/経費精算/_howto/国内出張）
        title:
          type: string
        content:
          type: string
          description: 本文（Markdown）
        content_format:
          type: string
          enum: [markdown]
        metadata:
          type: object
          description: frontmatter 由来のメタデータ
          additionalProperties: true
          example:
            type: howto
            audience: 全社
            owner: tamura@example.com
            review_due: '2026-12-31'
            related: ['/manuals/...']
            status: published
            canonical: false
        version:
          type: string
          description: ページのバージョン識別子（リビジョン番号・ハッシュ等。Adapter ごとに形式異なる）
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        viewer_url:
          type: string
          format: uri
          description: |
            人間がブラウザで開く URL。呼び出し側はこの URL を再加工しない。
            引用やリンクにそのまま使う。
        attachments:
          type: array
          items: { $ref: '#/components/schemas/Attachment' }

    PageMeta:
      type: object
      description: 一覧表示用の軽量版（本文を含まない）
      required: [id, path, title, version, updated_at, viewer_url]
      properties:
        id: { type: string }
        path: { type: string }
        title: { type: string }
        version: { type: string }
        updated_at: { type: string, format: date-time }
        viewer_url: { type: string, format: uri }
        metadata:
          type: object
          additionalProperties: true

    PageList:
      type: object
      properties:
        pages:
          type: array
          items: { $ref: '#/components/schemas/PageMeta' }
        next_cursor:
          type: string
          nullable: true

    # title / metadata と content 内 frontmatter の優先順位（create/update/upsert 共通）:
    #   1. metadata のキーは content の frontmatter を上書きする（明示指定が最優先）
    #   2. title は frontmatter に title が無い場合のフォールバック（上書きしない。
    #      content の frontmatter が正。title を変えたいときは content か metadata で指定する）
    PageCreateRequest:
      type: object
      required: [path, title, content]
      properties:
        path: { type: string }
        title:
          type: string
          description: content の frontmatter に title が無い場合のフォールバック
        content: { type: string }
        content_format:
          type: string
          enum: [markdown]
          default: markdown
        metadata:
          type: object
          additionalProperties: true
          description: content の frontmatter とマージされる（こちらが優先）

    PageUpdateRequest:
      type: object
      required: [content]
      properties:
        title:
          type: string
          description: content の frontmatter に title が無い場合のフォールバック
        content: { type: string }
        metadata:
          type: object
          additionalProperties: true
          description: content の frontmatter とマージされる（こちらが優先）
        expected_version:
          type: string
          description: 楽観ロック用。指定するとバージョン不一致時に 409

    UpsertRequest:
      type: object
      required: [path, content]
      properties:
        target_page_id:
          type: string
          description: 更新対象のページ ID。空なら path に新規作成
        path: { type: string, description: 新規作成時の配置パス }
        title: { type: string }
        content: { type: string }
        content_format: { type: string, enum: [markdown] }
        metadata:
          type: object
          additionalProperties: true

    GetContentResponse:
      type: object
      required: [exists]
      properties:
        exists: { type: boolean }
        content: { type: string }
        title: { type: string }
        viewer_url: { type: string, format: uri }
        status:
          type: string
          description: 既存ページの status（更新時に引き継ぐため。無ければ空）

    ChangeEvent:
      type: object
      required: [event_type, page_id, occurred_at]
      properties:
        event_type:
          type: string
          enum: [created, updated, deleted, moved]
        page_id: { type: string }
        path: { type: string }
        old_path:
          type: string
          description: moved の場合のみ
        version: { type: string }
        occurred_at: { type: string, format: date-time }

    Attachment:
      type: object
      properties:
        id: { type: string }
        filename: { type: string }
        mime_type: { type: string }
        size_bytes: { type: integer }
        url:
          type: string
          format: uri
          description: 添付ファイルの取得 URL

    Error:
      type: object
      required: [error_code, message]
      properties:
        error_code: { type: string }
        message: { type: string }
        details:
          type: object
          additionalProperties: true
