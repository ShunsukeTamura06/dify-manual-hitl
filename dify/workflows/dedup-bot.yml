    - data:
        code: |

          def main(proposals) -> dict:
              proposals = proposals or []
              bulk = [p for p in proposals if p.get("lane") == "bulk"]
              review = [p for p in proposals if p.get("lane") != "bulk"]
              lines = []
              lines.append("重複候補を " + str(len(proposals)) + " クラスタ検出しました。")
              lines.append("")
              if bulk:
                  lines.append("【高確信・一括承認候補】(" + str(len(bulk)) + "件)")
                  for p in bulk:
                      lines.append("- 「" + str(p.get("representative_title", "")) + "」 重複 "
                                   + str(len(p.get("page_ids", []))) + "ページ (重なり "
                                   + str(round(p.get("min_overlap", 0) * 100)) + "%)")
                      for t in p.get("titles", []):
                          lines.append("    ・" + str(t))
                  lines.append("")
              if review:
                  lines.append("【要確認・個別承認】(" + str(len(review)) + "件)")
                  for p in review:
                      lines.append("- 「" + str(p.get("representative_title", "")) + "」 類似 "
                                   + str(len(p.get("page_ids", []))) + "ページ (重なり "
                                   + str(round(p.get("min_overlap", 0) * 100)) + "%, 要確認)")
                      for t in p.get("titles", []):
                          lines.append("    ・" + str(t))
                  lines.append("")
              if not proposals:
                  lines.append("(重複候補は見つかりませんでした)")
              lines.append("※ これは提案です。統合の実行は次段（承認→LLM統合→反映）で行います。")
              return {"text": "\n".join(lines)}
        code_language: python3
        desc: 提案をlane別に読みやすく整形
        outputs:
