app:
  description: マニュアル登録Bot (Phase 1c). ファイルを整形して GROWI に下書き作成する。
  icon: 📝
  icon_background: '#E0F2FE'
  mode: advanced-chat
  name: マニュアル登録Bot
  use_icon_as_answer_icon: false
kind: app
version: 0.1.5
# ============================================================================
# 注意:
#  Dify 1.9.2 で DSL インポート → 起動まで実機検証済み（completed-with-warnings で
#  インポートでき、本ファイルの反映済み修正で正常動作する）。
#  検証時に判明した 1.9.2 必須フィールドは本ファイルに反映済み:
#   - parameter-extractor: reasoning_mode
#   - code: outputs は辞書形式
#   - http-request: authorization
#
#  インポート後に環境に合わせて調整する箇所:
#   - llm1 / parameter_extractor ノードのモデル（既定は Anthropic Claude。
#     OpenAI を使うなら provider=langgenius/openai/openai, name=gpt-4o-mini 等）
#   - environment_variables の DOCSTORE_URL（下記）
# ============================================================================
workflow:
  conversation_variables: []
  environment_variables:
    # docstore-growi の到達 URL。
    # Dify と同じ docker ネットワークにコンテナ配置するなら http://docstore-growi:8001
    # （Dify の HTTP ノードは ssrf_proxy 経由。コンテナ名で到達でき検証済み）。
    # ホストで uvicorn 起動なら http://host.docker.internal:8001
    - name: DOCSTORE_URL
      value: http://docstore-growi:8001
      value_type: string
  features:
    file_upload:
      enabled: true
      allowed_file_types:
        - document
      number_limits: 1
    opening_statement: |
      整備したいマニュアル（Word/Excel/PDF）を添付し、
      補足があればメッセージに書いて送ってください。
      整形して GROWI に下書きを作成します。
    retriever_resource:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    speech_to_text:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
      - {id: e1, source: start, target: doc_extractor, sourceHandle: source, targetHandle: target, type: custom}
      - {id: e2, source: doc_extractor, target: llm1, sourceHandle: source, targetHandle: target, type: custom}
      - {id: e3, source: llm1, target: param_extractor, sourceHandle: source, targetHandle: target, type: custom}
      - {id: e4, source: param_extractor, target: build_body, sourceHandle: source, targetHandle: target, type: custom}
      - {id: e5, source: build_body, target: http_create, sourceHandle: source, targetHandle: target, type: custom}
      - {id: e6, source: http_create, target: answer, sourceHandle: source, targetHandle: target, type: custom}
    nodes:
      # ── Start（ファイルアップロード）──
      - id: start
        type: custom
        position: {x: 80, y: 282}
        data:
          type: start
          title: 開始
          variables: []

      # ── Document Extractor ──
      - id: doc_extractor
        type: custom
        position: {x: 360, y: 282}
        data:
          type: document-extractor
          title: ファイル抽出
          variable_selector: [sys, files]
          is_array_file: true

      # ── LLM-1: 整形 ──
      - id: llm1
        type: custom
        position: {x: 640, y: 282}
        data:
          type: llm
          title: 整形 (LLM-1)
          model:
            provider: anthropic
            name: claude-sonnet-4-5-20250929   # 利用可能な Claude モデルに
            mode: chat
            completion_params:
              temperature: 0.2
              max_tokens: 4000
          prompt_template:
            # 重要: ここにプロンプト「全文」を入れる。モデルは外部ファイルを読めないため、
            # 「prompts/llm1-format.md 参照」のような指示は機能しない（実機検証で英語スラッグ・
            # コードフェンス混入の原因になった）。最新の全文は prompts/llm1-format.md と同期する。
            - role: system
              text: |
                あなたは社内マニュアルを整備する編集者です。
                アップロードされた素材を、社内標準テンプレートに沿った Markdown に整形してください。

                # 出力は必ず frontmatter + 本文。frontmatter は以下:
                # title / path / type / audience / owner / review_due / status: draft / canonical
                # （owner・review_due は不明なら空欄。創作しない）

                # path の決め方（重要・厳守）
                - 形式: /manuals/<部署>/<業務カテゴリ>/_<type>/<タスク名>
                - 各セグメントは必ず日本語のまま書く。英語・ローマ字・slug に変換してはいけない。
                - スペースは入れない。区切りも日本語の語をそのまま繋ぐ。
                - 例: /manuals/総務/出張/_howto/出張を申請する
                - 部署・カテゴリが不明なら「未分類」を使う。例 /manuals/未分類/_howto/出張を申請する

                # type: tutorial(学習) / howto(手順) / reference(一覧) / explanation(背景)。1ページ1type。

                # 本文: ## 概要 / 対象者 / 前提条件 / 手順 / トラブルシューティング / よくある質問 / 改訂履歴
                - 見出し直下に1-2文の要約。表は残し直前に要約平文を付ける。連番厳守。略語は定義。
                - 素材に無い情報は創作しない。

                # 出力形式（厳守）
                - frontmatter を含む Markdown 本文そのものだけを出力する。
                - 全体を ``` や ```markdown のコードフェンスで囲まない。
                - 前置き・説明文を付けない。
            - role: user
              text: |
                # 元のマニュアル素材
                {{#doc_extractor.text#}}

                # ユーザーからの補足
                {{#sys.query#}}
          context: {enabled: false, variable_selector: []}
          vision: {enabled: false}

      # ── Parameter Extractor: path/title/type ──
      - id: param_extractor
        type: custom
        position: {x: 920, y: 282}
        data:
          type: parameter-extractor
          title: 項目抽出
          reasoning_mode: prompt   # Dify 1.9.2 で必須
          model:
            provider: anthropic
            name: claude-sonnet-4-5-20250929
            mode: chat
            completion_params: {temperature: 0}
          query: [llm1, text]
          parameters:
            - {name: path, type: string, required: true, description: frontmatter の path（GROWI 配置パス）}
            - {name: title, type: string, required: true, description: frontmatter の title}
            - {name: type, type: string, required: false, description: frontmatter の type}
          instruction: |
            与えられた Markdown の frontmatter から path, title, type を抽出してください。
            値が無い場合は空文字にしてください。

      # ── Code: JSON ボディ組立 ──
      - id: build_body
        type: custom
        position: {x: 1200, y: 282}
        data:
          type: code
          title: ボディ組立
          code_language: python3
          variables:
            - {variable: path, value_selector: [param_extractor, path]}
            - {variable: title, value_selector: [param_extractor, title]}
            - {variable: type_, value_selector: [param_extractor, type]}
            - {variable: content, value_selector: [llm1, text]}
          code: |
            import json

            def main(path: str, title: str, type_: str, content: str) -> dict:
                # content には LLM-1 が作った frontmatter（status: draft 等）が
                # 既に含まれる。metadata を別送すると frontmatter が二重になるため、
                # metadata は空にし、content の frontmatter を正とする。
                # アダプタは読み出し時に frontmatter を metadata に復元する（往復一致）。
                body = json.dumps(
                    {
                        "path": path,
                        "title": title,
                        "content": content,
                        "metadata": {},
                    },
                    ensure_ascii=False,
                )
                return {"body": body}
          # Dify 1.9.2 では outputs は辞書形式
          outputs:
            body: {type: string}

      # ── HTTP Request: POST /pages ──
      - id: http_create
        type: custom
        position: {x: 1480, y: 282}
        data:
          type: http-request
          title: GROWI下書き作成
          method: post
          url: '{{#env.DOCSTORE_URL#}}/pages'
          authorization: {type: no-auth, config: null}   # Dify 1.9.2 で必須
          headers: 'Content-Type:application/json'
          params: ''
          body:
            type: raw-text
            data: '{{#build_body.body#}}'
          timeout: {max_connect_timeout: 10, max_read_timeout: 60, max_write_timeout: 60}

      # ── Answer ──
      - id: answer
        type: custom
        position: {x: 1760, y: 282}
        data:
          type: answer
          title: 完了通知
          answer: |
            GROWI に下書きを作成しました（status: draft）。
            内容を確認し、問題なければ GROWI で「公開」してください。
            公開すると次回同期で質問Botに反映されます。

            レスポンス: {{#http_create.body#}}
