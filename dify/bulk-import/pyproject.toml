[project]
name = "bulk-import-splitter"
version = "0.1.0"
description = "一括取り込み Bot のスプリッター（案A Map-Reduce のウィンドウ分割・継ぎ合わせ）"
readme = "README.md"
requires-python = ">=3.11"
# 本体は標準ライブラリのみ。Dify Code ノードのサンドボックスでそのまま動かすため
# 外部依存を持たない（追加すると Dify 側で import できず壊れる）。
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "W"]

[tool.mypy]
python_version = "3.11"
strict = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["splitter"]
