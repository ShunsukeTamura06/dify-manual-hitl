    - data:
        dataset_ids:
        - S0nYaYbe1DHkjfH5U6D5w4pA61DRnyluxbefZo6ujFnrilynfgF6N7Zp6B2MQzmp
        multiple_retrieval_config:
          reranking_enable: false
          reranking_mode: weighted_score
          score_threshold: 0.4
          score_threshold_enabled: true
          top_k: 3
          weights:
            keyword_setting:
              keyword_weight: 0
            vector_setting:
              embedding_model_name: ''
              embedding_provider_name: ''
              vector_weight: 1
            weight_type: customized
        query_variable_selector:
        - param_extractor
        - title
        retrieval_mode: multiple
        title: 類似ページ検索
        type: knowledge-retrieval
      id: similar_search
      position:
        x: 1060
        y: 460
      positionAbsolute:
        x: 1060
        y: 460
      type: custom
    - data:
        code: "\ndef main(items: list) -> dict:\n    seen = {}\n    for r in (items\
          \ or []):\n        meta = r.get(\"metadata\", {}) or {}\n        name =\
          \ meta.get(\"document_name\", \"\") or r.get(\"title\", \"\")\n        title\
          \ = name.split(\"::\", 1)[1] if \"::\" in name else name\n        score\
          \ = meta.get(\"score\") or 0\n        if title and title not in seen:\n\
          \            seen[title] = score\n    if not seen:\n        return {\"text\"\
          : \"（内容が近い既存ページは見つかりませんでした）\"}\n    lines = []\n    for t, s in sorted(seen.items(),\
          \ key=lambda x: -x[1]):\n        lines.append(f\"- {t}（類似度 {round(s*100)}%）\"\
          )\n    return {\"text\": \"\\n\".join(lines)}\n"
        code_language: python3
        outputs:
          text:
            type: string
        title: 類似ページ整形
        type: code
        variables:
        - value_selector:
          - similar_search
          - result
          variable: items
      id: sim_format
      position:
        x: 1330
