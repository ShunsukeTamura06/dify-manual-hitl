            - content は読みやすい Markdown に整える（情報の追加・創作はしない）。


            # 出力形式（厳守）

            - JSON 配列「のみ」を出力する。前置き・後書き・コードフェンスを付けない。

            - 各要素: {"title": "見出し", "content": "本文(Markdown)", "continues_previous":
            false, "incomplete": false}

            - トピックが無い（空白等）場合は空配列 [] を出力する。'
