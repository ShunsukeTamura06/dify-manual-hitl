    - data:
        type: code
        title: 完全性チェック
        code_language: python3
        code: "\nimport difflib\n\nCOMPLETENESS_THRESHOLD = 0.7\n\n\ndef _norm(text):\n\
          \    return \" \".join((text or \"\").split())\n\n\ndef _best_window_ratio(haystack,\
          \ needle):\n    n = len(needle)\n    if n == 0 or len(haystack) < n:\n \
          \       return 0.0\n    best = 0.0\n    step = max(1, n // 4)\n    for start\
          \ in range(0, len(haystack) - n + 1, step):\n        r = difflib.SequenceMatcher(None,\
          \ needle, haystack[start:start + n]).ratio()\n        if r > best:\n   \
          \         best = r\n            if best >= 0.95:\n                break\n\
          \    return best\n\n\ndef _contains(haystack_norm, line_norm):\n    if line_norm\
          \ in haystack_norm:\n        return True\n    ratio = difflib.SequenceMatcher(None,\
          \ line_norm, haystack_norm).ratio()\n    return ratio >= 0.6 or _best_window_ratio(haystack_norm,\
          \ line_norm) >= 0.8\n\n\ndef main(merged_content: str, member_contents)\
          \ -> dict:\n    norm_merged = _norm(merged_content)\n    warnings = []\n\
          \    worst = 1.0\n    for idx, content in enumerate(member_contents or []):\n\
          \        lines = [_norm(ln) for ln in (content or \"\").splitlines() if\
          \ _norm(ln)]\n        signif = [ln for ln in lines if len(ln) >= 4 and ln\
          \ not in (\"---\",)]\n        if not signif:\n            continue\n   \
          \     present = sum(1 for ln in signif if _contains(norm_merged, ln))\n\
          \        coverage = present / len(signif)\n        worst = min(worst, coverage)\n\
          \        if coverage < COMPLETENESS_THRESHOLD:\n            warnings.append(f\"\
          元ページ{idx + 1}: 内容の{round(coverage * 100)}%程度しか統合本文に見当たりません\")\n    return\
          \ {\"ok\": 0 if warnings else 1, \"coverage\": round(worst, 3), \"warnings\"\
          : warnings}\n"
        desc: 元ページの主張が統合本文から欠落していないか機械チェック（HITLの補助）
        outputs:
          ok:
            children: null
            type: number
          coverage:
            children: null
            type: number
          warnings:
            children: null
            type: array[string]
        variables:
        - variable: merged_content
          value_selector:
          - m_merge_llm
          - text
        - variable: member_contents
          value_selector:
          - m_unpack
          - member_contents
        isInIteration: true
        iteration_id: merge_iter
      id: m_check
