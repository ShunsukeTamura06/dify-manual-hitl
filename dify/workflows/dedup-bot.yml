    - data:
        type: code
        title: 実行判定
        code_language: python3
        code: "\nimport difflib\n\n_APPROVAL_KEYWORDS = (\"承認\", \"統合して\", \"統合する\"\
          , \"実行\", \"まとめて\", \"ok\", \"はい\")\n\n\ndef _is_approval(query):\n    q\
          \ = (query or \"\").strip().lower()\n    return bool(q) and any(k in q for\
          \ k in _APPROVAL_KEYWORDS)\n\n\ndef _prepare_jobs(proposals, pages):\n \
          \   by_id = {str(p.get(\"id\", \"\")): p for p in (pages or [])}\n    jobs\
          \ = []\n    for prop in proposals or []:\n        if prop.get(\"lane\")\
          \ != \"bulk\":\n            continue\n        page_ids = [str(i) for i in\
          \ prop.get(\"page_ids\", [])]\n        members = [by_id[i] for i in page_ids\
          \ if i in by_id]\n        if len(members) < 2:\n            continue\n \
          \       rep_id = str(prop.get(\"representative_id\", \"\"))\n        if\
          \ rep_id not in by_id:\n            rep = max(members, key=lambda m: len(str(m.get(\"\
          content\", \"\"))))\n            rep_id = str(rep.get(\"id\", \"\"))\n \
          \       rep = by_id[rep_id]\n        merge_input = \"\\n\\n\".join(\n  \
          \          \"## \" + str(m.get(\"title\", \"\")) + \"\\n\" + str(m.get(\"\
          content\", \"\")) for m in members\n        )\n        jobs.append({\n \
          \           \"representative_id\": rep_id,\n            \"representative_path\"\
          : str(rep.get(\"path\", \"\")),\n            \"representative_title\": str(rep.get(\"\
          title\", \"\")),\n            \"merge_input\": merge_input,\n          \
          \  \"member_contents\": [str(m.get(\"content\", \"\")) for m in members],\n\
