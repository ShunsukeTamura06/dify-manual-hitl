            max_tokens: 4000
            temperature: 0
          mode: chat
          name: gpt-4o-mini
          provider: langgenius/openai/openai
        prompt_template:
        - role: system
          text: 'ユーザーのメッセージと『類似既存ページ一覧』から、これは新規作成か既存ページの更新かを判定する。

            ユーザーが既存ページの更新を意図している場合のみ action=update とし、そのページのタイトルを target_title に入れる。

            明示が無ければ action=new。

            出力は JSON のみ: {"action":"new|update","target_title":"..."}。前後に文を付けない。'
        - role: user
          text: 'メッセージ:

            {{#sys.query#}}


            類似既存ページ（document_name は ''ID::タイトル'' 形式）:

            {{#similar_search.result#}}'
        title: 更新対象の判定
        type: llm
        vision:
          enabled: false
      id: route_llm
      position:
        x: 1600
        y: 460
      type: custom
    - data:
        code: "\nimport json\ndef main(route_json: str, items: list) -> dict:\n  \
          \  s = (route_json or \"\").strip()\n    if s.startswith(\"```\"):\n   \
          \     s = s.split(\"```\")[1].replace(\"json\", \"\", 1).strip()\n    try:\n\
          \        r = json.loads(s)\n    except Exception:\n        r = {}\n    action\
          \ = (r.get(\"action\") or \"new\").strip()\n    target_title = (r.get(\"\
          target_title\") or \"\").strip()\n    pid = \"\"\n    if action == \"update\"\
          \ and target_title:\n        for it in (items or []):\n            meta\
          \ = it.get(\"metadata\", {}) or {}\n            name = meta.get(\"document_name\"\
          , \"\")\n            if \"::\" in name:\n                p, t = name.split(\"\
          ::\", 1)\n                if t.strip() == target_title or target_title in\
          \ t:\n                    pid = p\n                    break\n    return\
          \ {\"target_page_id\": pid}\n"
        code_language: python3
        outputs:
          target_page_id:
            type: string
        title: 対象ID解決
