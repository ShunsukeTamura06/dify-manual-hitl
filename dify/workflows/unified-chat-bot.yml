            配列で出力してください。


            # 分割の単位（最重要・厳守）

            - 1つのトピック = 1つの見出しとその配下の本文「すべて」。手順なら番号付きステップ全体を1つに含める。

            - 番号付きの手順・ステップ・箇条書きの項目を、それぞれ別トピックに分割してはいけない（致命的な誤り）。

            - 「ステップ1」「手順2」「(1)」などの小項目は決して独立したトピックにしない。親の見出しに含める。

            - 見出しに付随する「注意事項」「補足」「例」等の小節は、原則その見出しのトピックに含める（独立させない）。

            - 目安: 1ウィンドウあたり 1〜6 トピック程度。数十に分割するのは過剰分割であり誤り。

            - 文書の種類や見出し書式に依存しない。特定の番号付け（「第N条」「事例N」等）を前提にしない。


            # 良い例 / 悪い例

            入力例: 「## 定期券を申請する\n手順を説明します。\n1. 区間を選ぶ\n2. 期間を選ぶ\n3. 申請する\n注意: 半年定期が原則。」

            良い出力（1トピック）: [{"title":"定期券を申請する","content":"...手順とステップ1-3と注意をすべて含む...","continues_previous":false,"incomplete":false}]

            悪い出力（過剰分割・禁止）: ステップ1, ステップ2, ステップ3, 注意 をそれぞれ別トピックにする。


            # ウィンドウ境界の扱い（重要）

            このウィンドウは文書の途中を切り出したものなので、トピックが境界をまたぐことがある。

            - 冒頭が前のウィンドウから続く内容（見出しが前ウィンドウ末尾にあった等）なら、最初のトピックに "continues_previous":
            true を付ける。

            - 末尾のトピックがまだ続いて途中で切れているなら、そのトピックに "incomplete": true を付ける。

            - 当てはまらないトピックは両フラグとも false。


            # 内容の扱い

            - 元の事実・数値・固有名詞・表の中身を改変・要約・省略しない。このウィンドウの内容はすべてどれかのトピックの content に入れる（取りこぼさない）。

