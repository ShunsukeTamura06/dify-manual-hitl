    - data:
        type: code
        title: ルーター(決定的)
        desc: 添付有無・文字数・キーワード + LLM意図 で qa/register/bulk/dedup を決定
        code_language: python3
        code: "\"\"\"統一チャット（完全 bot）: 決定的サニタイズ付きルーティング。\n\nqa / register / bulk / dedup\
          \ / pending の 5 機能を 1 入口で振り分ける。ユーザーは\nどの機能かを選ばず、bot が意図を汲んで自律的にルートを決める。設計は\n\
          [docs/unified-chat-design.md] を参照。\n\n方針:\n- **添付の有無・抽出文字数・明示キーワードは決定的に判定**する（書込系フローの\n\
          \  誤発火を防ぐ。ここを LLM に委ねると、質問のつもりが書き込まれる等の事故が起きる）。\n- **意図が曖昧な部分（質問か重複整理の依頼か等）は\
          \ LLM の分類結果（llm_intent）を\n  採用**する＝自律的。ただし LLM の結果は必ず「添付という物理的事実」で矯正する\n\
          \  （添付が無いのに書込系を選ぶ、を許さない）。\n\nルート:\n- qa       : 質問応答（RAG）\n- register :\
          \ 1 ファイル → 1 ページ登録／既存ページへのマージ更新\n- bulk     : 大きな文書を複数ページに分割取り込み\n- dedup\
          \    : Wiki の重複ページを検出して統合を提案（提示まで）\n- pending  : 承認待ち（status: draft）ページの一覧を見せる（読み取り専用。HITL\
          \ 運用の可視化）\n\nこのファイルは標準ライブラリのみで完結しており、`main` をそのまま Dify の\nCode ノードに貼り付けられる。\n\
          \"\"\"\n\n# bulk（分割取り込み）に切り替える抽出テキスト長の閾値（スプリッターのウィンドウ上限）。\nBULK_THRESHOLD_CHARS\
          \ = 7000\n\n# 決定的に優先する明示キーワード（正規表現・LLM は使わない）\n_BULK_KEYWORDS = (\"分割\"\
          , \"一括\")\n_REGISTER_KEYWORDS = (\"更新\",)\n_DEDUP_KEYWORDS = (\"重複\", \"\
          重複排除\")\n_PENDING_KEYWORDS = (\"承認待ち\", \"下書き一覧\", \"draft一覧\", \"未承認\"\
          )\n\nROUTE_QA = \"qa\"\nROUTE_REGISTER = \"register\"\nROUTE_BULK = \"bulk\"\
          \nROUTE_DEDUP = \"dedup\"\nROUTE_PENDING = \"pending\"\n_VALID_ROUTES =\
          \ (ROUTE_QA, ROUTE_REGISTER, ROUTE_BULK, ROUTE_DEDUP, ROUTE_PENDING)\n\n\
          \ndef _coerce_text(text: object) -> str:\n    \"\"\"Document Extractor の出力を文字列に正規化する。\n\
          \n    複数ファイル対応（is_array_file）の抽出ノードは text を array[string] で返すため、\n    リストで来たら連結して合計長で判定する。None\
          \ は空文字。\n    \"\"\"\n    if isinstance(text, list):\n        return \"\\\
          n\\n\".join(str(t) for t in text if t)\n    if text is None:\n        return\
          \ \"\"\n    return str(text)\n\n\ndef _clean_intent(llm_intent: object)\
          \ -> str:\n    \"\"\"ルーター LLM の出力からルート名を取り出す（前後の語や記号を許容）。\n\n    LLM は \"\
          bulk\" のように 1 語で返す想定だが、\"route: dedup\" や全角・引用符混じりでも\n    拾えるよう部分一致で正規化する。未知の出力は空文字（＝LLM\
          \ 判断なし扱い）。\n    \"\"\"\n    s = str(llm_intent or \"\").strip().lower()\n\
          \    for route in _VALID_ROUTES:\n        if route in s:\n            return\
          \ route\n    return \"\"\n\n\ndef decide_route(\n    query: str,\n    extracted_text:\
          \ object,\n    llm_intent: object = None,\n    threshold: int = BULK_THRESHOLD_CHARS,\n\
          ) -> str:\n    \"\"\"メッセージ・添付・LLM 意図から最終ルートを決める（決定的サニタイズ）。\n\n    Args:\n\
          \        query: ユーザーのメッセージ（sys.query）。\n        extracted_text: Document\
          \ Extractor の出力（str / list[str] / None）。\n            添付が無い場合は空になる。\n  \
          \      llm_intent: ルーター LLM が分類した意図（qa/register/bulk/dedup）。無くてもよい。\n  \
          \      threshold: bulk に切り替える抽出テキスト長。\n\n    Returns:\n        \"qa\" /\
          \ \"register\" / \"bulk\" / \"dedup\" / \"pending\" のいずれか。\n    \"\"\"\n\
          \    text = _coerce_text(extracted_text)\n    q = query or \"\"\n    intent\
          \ = _clean_intent(llm_intent)\n    has_attachment = bool(text.strip())\n\
          \n    if not has_attachment:\n        # 添付なし＝書込材料が無い。register/bulk は物理的にあり得ないので、\n\
          \        # LLM が書込系を提案しても qa/dedup/pending に矯正する（誤発火の遮断）。\n        if intent\
          \ == ROUTE_PENDING or any(k in q for k in _PENDING_KEYWORDS):\n        \
          \    return ROUTE_PENDING\n        if intent == ROUTE_DEDUP or any(k in\
          \ q for k in _DEDUP_KEYWORDS):\n            return ROUTE_DEDUP\n       \
          \ return ROUTE_QA\n\n    # 添付あり＝書込系。誤ると影響が大きいので、確実に判定できる材料を優先する。\n    if\
          \ any(k in q for k in _BULK_KEYWORDS):\n        return ROUTE_BULK\n    if\
          \ any(k in q for k in _REGISTER_KEYWORDS):\n        return ROUTE_REGISTER\n\
          \    if len(text) > threshold:\n        return ROUTE_BULK\n    # 決定打が無ければ\
          \ LLM の bulk 提案だけ尊重（分割は取り逃すと欠落する）。\n    # dedup/qa/pending は添付ありでは選べない（書込対象があるため\
          \ register に倒す）。\n    if intent == ROUTE_BULK:\n        return ROUTE_BULK\n\
          \    return ROUTE_REGISTER\n\n\ndef main(query: str, extracted_text: object\
          \ = None, llm_intent: object = None) -> dict[str, str]:\n    \"\"\"Dify\
          \ Code ノード用エントリ。\n\n    Args:\n        query: sys.query。\n        extracted_text:\
          \ Document Extractor の出力（添付なしなら空/None）。\n        llm_intent: ルーター LLM の分類結果（無くてもよい）。\n\
          \n    Returns:\n        {\"route\": \"qa\"|\"register\"|\"bulk\"|\"dedup\"\
          |\"pending\"}。後続の IF/ELSE で分岐する。\n    \"\"\"\n    return {\"route\": decide_route(query,\
          \ extracted_text, llm_intent)}\n"
        outputs:
          route:
            type: string
        variables:
        - variable: query
          value_selector:
          - sys
          - query
        - variable: extracted_text
          value_selector:
          - doc_extractor
          - text
        - variable: llm_intent
          value_selector:
          - router_llm
          - text
      id: router
