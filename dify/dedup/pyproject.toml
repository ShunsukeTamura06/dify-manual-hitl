[project]
name = "dedup-proposal"
version = "0.1.0"
description = "重複排除 提案フローのコア（クラスタリング・確信度・提案組立。HITL提案→承認→実行）"
readme = "README.md"
requires-python = ">=3.11"
# 本体は標準ライブラリのみ。Dify Code ノードのサンドボックスでそのまま動かすため外部依存を持たない。
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "W"]

[tool.mypy]
python_version = "3.11"
strict = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dedup"]
