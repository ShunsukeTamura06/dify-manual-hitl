    - data:
        code: "\ndef main(proposals) -> dict:\n    proposals = proposals or []\n \
          \   bulk = [p for p in proposals if p.get(\"lane\") == \"bulk\"]\n    review\
          \ = [p for p in proposals if p.get(\"lane\") != \"bulk\"]\n    lines = []\n\
          \    lines.append(\"重複候補を \" + str(len(proposals)) + \" クラスタ検出しました。\")\n\
          \    lines.append(\"\")\n    if bulk:\n        lines.append(\"【高確信・一括承認候補】(\"\
          \ + str(len(bulk)) + \"件)\")\n        for p in bulk:\n            lines.append(\"\
          - 「\" + str(p.get(\"representative_title\", \"\")) + \"」 重複 \"\n       \
          \                  + str(len(p.get(\"page_ids\", []))) + \"ページ (重なり \"\n\
          \                         + str(round(p.get(\"min_overlap\", 0) * 100))\
          \ + \"%)\")\n            for t in p.get(\"titles\", []):\n             \
          \   lines.append(\"    ・\" + str(t))\n        lines.append(\"\")\n    if\
          \ review:\n        lines.append(\"【要確認・個別承認】(\" + str(len(review)) + \"\
          件)\")\n        for p in review:\n            lines.append(\"- 「\" + str(p.get(\"\
          representative_title\", \"\")) + \"」 類似 \"\n                         + str(len(p.get(\"\
          page_ids\", []))) + \"ページ (重なり \"\n                         + str(round(p.get(\"\
          min_overlap\", 0) * 100)) + \"%, 要確認)\")\n            for t in p.get(\"\
          titles\", []):\n                lines.append(\"    ・\" + str(t))\n     \
          \   lines.append(\"\")\n    if not proposals:\n        lines.append(\"(重複候補は見つかりませんでした)\"\
          )\n    lines.append(\"※ 高確信の重複を統合するには「統合して」「実行」と送ってください\"\n            \
          \     \"（統合先は下書き、重複元は退役になります）。\")\n    return {\"text\": \"\\n\".join(lines)}\n"
        code_language: python3
        desc: 提案をlane別に読みやすく整形
        outputs:
