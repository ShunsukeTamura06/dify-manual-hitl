# 一括取り込みBot — 大規模文書を分割して複数ページに取り込む (案A Map-Reduce)
# 既存の登録Bot(1ファイル=1ページ)とは別アプリ。巨大文書が1ページに圧縮される問題の解決。
#
# フロー:
#   Start(file) → 抽出 → ウィンドウ分割(Code)
#     → Iteration(各ウィンドウ): LLMで完結トピックをJSON配列抽出
#     → 継ぎ合わせ(Code: 境界セクション結合)
#     → Iteration(各ページ): 整形LLM → frontmatter解析+body組立(Code) → GROWI upsert(HTTP)
#     → 集計(Code) → 回答
#
# Code ノードのロジックは dify/bulk-import/splitter/ と同一(ローカル単体テスト済み)。
# インポート後の環境合わせ: LLMモデル / environment_variables.DOCSTORE_URL。
