          \ dict):\n            continue\n        pages.append({\n            \"title\"\
          : str(item.get(\"title\", \"\")).strip(),\n            \"content\": str(item.get(\"\
          content\", \"\")),\n            \"continues_previous\": bool(item.get(\"\
          continues_previous\", False)),\n            \"incomplete\": bool(item.get(\"\
          incomplete\", False)),\n        })\n    return pages\n\n\ndef _normalize_title(t):\n\
          \    return \" \".join(t.split())\n\n\ndef main(window_results: list) ->\
          \ dict:\n    merged = []\n    prev_dangling = False\n    for result in (window_results\
          \ or []):\n        pages = _coerce_pages(result)\n        for i, page in\
          \ enumerate(pages):\n            at_boundary = i == 0\n            same_title\
          \ = (at_boundary and bool(merged) and bool(page[\"title\"])\n          \
          \                and _normalize_title(merged[-1][\"title\"]) == _normalize_title(page[\"\
          title\"]))\n            join = bool(merged) and (page[\"continues_previous\"\
          ]\n                                     or (at_boundary and prev_dangling)\
          \ or same_title)\n            if join:\n                tail = merged[-1]\n\
