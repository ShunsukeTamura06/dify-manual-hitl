# 重複排除Bot（提案フロー v1: ①解析→②提案→③提示）— HITL「提案→承認→実行」の前半
# Wiki の既存ページを走査し、重複クラスタを検出して「高確信=一括 / 要確認=個別」に振り分けて提示する。
# 候補ペアは本文の総当たり difflib で決定的に生成（意味検索は大規模化時に差し替え）。
# 検出・提案組立ロジックは dify/dedup/dedup/clustering.py と同一（ローカル単体テスト済み）。
#
# v1 は③提示まで。④承認→⑤統合(LLM統合→upsert/退役)は次スライス。
# インポート後の環境合わせ: environment_variables.DOCSTORE_URL。
