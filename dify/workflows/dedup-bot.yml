    - data:
        code: "\nimport json\nimport difflib\n\nHIGH_OVERLAP = 0.8\nCANDIDATE_OVERLAP\
          \ = 0.5\nTITLE_AGREE_OVERLAP = 0.5\n\ndef _norm(text):\n    return \" \"\
          .join((text or \"\").split())\n\ndef overlap_ratio(a, b):\n    return difflib.SequenceMatcher(None,\
          \ _norm(a), _norm(b)).ratio()\n\ndef cluster_min_overlap(texts):\n    if\
          \ len(texts) < 2:\n        return 1.0\n    worst = 1.0\n    for i in range(len(texts)):\n\
          \        for j in range(i + 1, len(texts)):\n            worst = min(worst,\
          \ overlap_ratio(texts[i], texts[j]))\n    return worst\n\ndef _build_clusters(ids,\
          \ pairs, min_score):\n    parent = {i: i for i in ids}\n    def find(x):\n\
          \        while parent[x] != x:\n            parent[x] = parent[parent[x]]\n\
          \            x = parent[x]\n        return x\n    def union(a, b):\n   \
          \     ra, rb = find(a), find(b)\n        if ra != rb:\n            parent[ra]\
          \ = rb\n    for a, b, score in pairs:\n        if a in parent and b in parent\
          \ and score >= min_score:\n            union(a, b)\n    groups = {}\n  \
          \  for i in ids:\n        groups.setdefault(find(i), []).append(i)\n   \
          \ clusters = [g for g in groups.values() if len(g) >= 2]\n    clusters.sort(key=lambda\
          \ g: ids.index(g[0]))\n    return clusters\n\ndef titles_similarity(titles):\n\
          \    norm = [_norm(t) for t in titles if _norm(t)]\n    if len(norm) < 2:\n\
          \        return 1.0\n    total, count = 0.0, 0\n    for i in range(len(norm)):\n\
          \        for j in range(i + 1, len(norm)):\n            total += difflib.SequenceMatcher(None,\
          \ norm[i], norm[j]).ratio()\n            count += 1\n    return total /\
          \ count\n\ndef classify_confidence(min_overlap, titles_agree):\n    if min_overlap\
          \ >= HIGH_OVERLAP and titles_agree:\n        return \"high\"\n    return\
          \ \"review\"\n\ndef build_proposals(pages, pairs, min_score):\n    by_id\
          \ = {str(p.get(\"id\", \"\")): p for p in pages}\n    ids = [str(p.get(\"\
          id\", \"\")) for p in pages]\n    clusters = _build_clusters(ids, pairs,\
          \ min_score)\n    proposals = []\n    for n, cluster in enumerate(clusters,\
          \ start=1):\n        members = [by_id[i] for i in cluster if i in by_id]\n\
          \        texts = [str(m.get(\"content\", \"\")) for m in members]\n    \
          \    titles = [str(m.get(\"title\", \"\")) for m in members]\n        min_ov\
          \ = cluster_min_overlap(texts)\n        titles_agree = titles_similarity(titles)\
          \ >= TITLE_AGREE_OVERLAP\n        confidence = classify_confidence(min_ov,\
          \ titles_agree)\n        rep = max(members, key=lambda m: len(str(m.get(\"\
          content\", \"\"))))\n        proposals.append({\n            \"cluster_id\"\
          : n,\n            \"page_ids\": [str(m.get(\"id\", \"\")) for m in members],\n\
          \            \"titles\": titles,\n            \"representative_id\": str(rep.get(\"\
          id\", \"\")),\n                \"representative_title\": str(rep.get(\"\
          title\", \"\")),\n            \"representative_path\": str(rep.get(\"path\"\
          , \"\")),\n            \"min_overlap\": round(min_ov, 3),\n            \"\
          confidence\": confidence,\n            \"lane\": \"bulk\" if confidence\
          \ == \"high\" else \"individual\",\n        })\n    return proposals\n\n\
          def candidate_pairs_from_content(pages, threshold):\n    ids = [str(p.get(\"\
          id\", \"\")) for p in pages]\n    texts = [str(p.get(\"content\", \"\"))\
          \ for p in pages]\n    pairs = []\n    for i in range(len(pages)):\n   \
          \     for j in range(i + 1, len(pages)):\n            ratio = overlap_ratio(texts[i],\
          \ texts[j])\n            if ratio >= threshold:\n                pairs.append((ids[i],\
          \ ids[j], ratio))\n    return pairs\n\ndef main(metas, contents) -> dict:\n\
          \    metas = metas or []\n    contents = contents or []\n    pages = []\n\
          \    for i, m in enumerate(metas):\n        raw = contents[i] if i < len(contents)\
          \ else \"\"\n        try:\n            cj = json.loads(raw) if isinstance(raw,\
          \ str) else (raw or {})\n        except Exception:\n            cj = {}\n\
          \        if isinstance(cj, dict) and cj.get(\"status\") == \"deprecated\"\
          :\n            continue\n        content = cj.get(\"content\", \"\") if\
          \ isinstance(cj, dict) else \"\"\n        pages.append({\n            \"\
          id\": str(m.get(\"id\", \"\")),\n            \"title\": str(m.get(\"title\"\
          , \"\")),\n            \"path\": str(m.get(\"path\", \"\")),\n         \
          \   \"content\": str(content),\n        })\n    pairs = candidate_pairs_from_content(pages,\
          \ CANDIDATE_OVERLAP)\n    return {\"proposals\": build_proposals(pages,\
          \ pairs, CANDIDATE_OVERLAP), \"pages\": pages}\n"
        code_language: python3
        desc: 本文総当たりで候補ペア→クラスタ→確信度→提案を組み立てる
        outputs:
          proposals:
            children: null
            type: array[object]
          pages:
            children: null
            type: array[object]
        selected: false
