# manual-knowledge サービス群（Dify とは独立した compose）
#
# 設計原則: Dify とは別 compose で運用する。
#   - Dify を更新してもこちらは無影響
#   - 他チーム展開時、このディレクトリだけ持っていけば動く
#
# 起動:
#   cd services
#   cp docstore-growi/.env.example docstore-growi/.env   # 値を設定
#   cp sync/.env.example          sync/.env              # 値を設定
#   docker compose up -d --build
#
# サービス間通信:
#   sync → docstore-growi は compose 内部 DNS (http://docstore-growi:8001)。
#   この URL は下の environment で上書きするため .env の DOCSTORE_URL は気にしなくてよい。
#
# Dify / GROWI への到達:
#   各 .env の URL で指定する。
#
# ★ 登録 Bot を使うなら重要（実機検証済みの知見）★
#   登録 Bot の「Wiki に書き込む」HTTP リクエストは Dify の SSRF プロキシ経由で出る。
#   そのため docstore-growi が「Dify のネットワーク」から到達できる必要がある。
#   → 確実なのは docstore-growi を Dify のネットワークに参加させること（末尾 networks 参照）。
#     参加後、Dify 登録 Bot の DOCSTORE_URL は http://docstore-growi:8001 にする。
#   質問 Bot だけなら sync が Dify に書ければよく、この参加は必須ではない。

name: manual-knowledge-services

services:
  docstore-growi:
    build: ./docstore-growi
    image: manual-knowledge/docstore-growi:0.1.0
    env_file:
      - ./docstore-growi/.env
    ports:
      - "8001:8001"
    volumes:
      # ログをホストに残す（診断バンドルで回収できるように）
      - ./docstore-growi/logs:/app/logs
    networks:
      - manual-net
    extra_hosts:
      # Linux でも host.docker.internal を解決できるように
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/info').status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  sync:
    build: ./sync
    image: manual-knowledge/sync:0.1.0
    env_file:
      - ./sync/.env
    environment:
      # サービス間 URL は compose 内部 DNS で確定的に上書き（.env より優先）
      - DOCSTORE_URL=http://docstore-growi:8001
    ports:
      - "8002:8002"
    volumes:
      - ./sync/logs:/app/logs
    networks:
      - manual-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      docstore-growi:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8002/info').status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  manual-net:
    driver: bridge

  # ── Dify のネットワークに参加する（登録 Bot を使うなら推奨）──
  #   手順:
  #   1) Dify 側のネットワーク名を確認:  docker network ls | grep -i ssrf
  #      （Dify の HTTP リクエストが通る SSRF プロキシのネットワーク。
  #        公式 compose では docker_ssrf_proxy_network 等）
  #   2) 下の dify_net の name を、確認したネットワーク名に合わせる
  #   3) 各 service の networks: に - dify_net を追加
  #   4) Dify 登録 Bot の DOCSTORE_URL を http://docstore-growi:8001 に
  #   5) sync の DIFY_API_BASE_URL は Dify のサービス名で到達（例 http://nginx）
  #
  # dify_net:
  #   external: true
  #   name: docker_ssrf_proxy_network   # ← 実際の Dify ネットワーク名に置き換え
