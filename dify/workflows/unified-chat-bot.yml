          type: raw-text
        headers: 'Content-Type:application/json

          X-API-Key:{{#env.DOCSTORE_API_KEY#}}'
        method: post
        params: ''
        timeout:
          max_connect_timeout: 10
          max_read_timeout: 60
          max_write_timeout: 60
        title: 既存本文の取得
        type: http-request
        url: '{{#env.DOCSTORE_URL#}}/pages/get-content'
      id: http_getcontent
      position:
        x: 2120
        y: 460
      type: custom
    - data:
        context:
          enabled: false
          variable_selector: []
        model:
          completion_params:
            max_tokens: 4000
            temperature: 0.2
          mode: chat
          name: gpt-4o-mini
          provider: langgenius/openai/openai
        prompt_template:
        - role: system
          text: '既存ページの本文（JSONの content フィールド。空なら新規）と、新しい素材から、統合した最終マニュアルを作る。

            - 既存が空なら新素材をそのまま整える。

            - 既存があれば、新素材の情報を既存の構造に溶け込ませる（重複は1つに、矛盾は新素材を優先しつつ注記）。

            - frontmatter を含む Markdown 本文そのものだけを出力。``` で囲まない。frontmatter に status
            は書かない（後段が自動設定する: 新規は draft、更新は既存の status を維持）。'
        - role: user
          text: '既存ページ(JSON):

            {{#http_getcontent.body#}}


            新しい素材(整形済み):

            {{#llm1.text#}}'
        title: 統合(マージ)
        type: llm
        vision:
          enabled: false
      id: merge_llm
      position:
        x: 2380
        y: 460
      type: custom
    - data:
        code: "\nimport json\n\ndef main(target_page_id: str, path: str, title: str,\
          \ content: str, existing_json: str) -> dict:\n    try:\n        existing_status\
          \ = str((json.loads(existing_json or \"{}\") or {}).get(\"status\", \"\"\
          ))\n    except Exception:\n        existing_status = \"\"\n    desired =\
          \ existing_status if (target_page_id or \"\") else \"draft\"\n\n    lines\
          \ = content.split(\"\\n\")\n    if lines and lines[0].strip() == \"---\"\
          :\n        # 既存 frontmatter 内の status 行を置き換える\n        try:\n          \
          \  end = lines[1:].index(\"---\") + 1\n        except ValueError:\n    \
          \        end = -1\n        if end > 0:\n            fm = [ln for ln in lines[1:end]\
          \ if not ln.strip().startswith(\"status:\")]\n            if desired:\n\
          \                fm.append(f\"status: {desired}\")\n            content\
          \ = \"\\n\".join([\"---\"] + fm + lines[end:])\n    elif desired:\n    \
          \    content = f\"---\\nstatus: {desired}\\n---\\n{content}\"\n\n    body\
          \ = json.dumps({\n        \"target_page_id\": target_page_id or \"\",\n\
          \        \"path\": path, \"title\": title,\n        \"content\": content,\
          \ \"metadata\": {},\n    }, ensure_ascii=False)\n    return {\"body\": body}\n"
        code_language: python3
        outputs:
