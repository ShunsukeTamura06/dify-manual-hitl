# マニュアルアシスタント（完全 bot）— tools/build_dsl.py が生成
# 質問(qa)/登録(register)/一括取り込み(bulk)/重複整理(dedup)/承認待ち確認(pending)
# を LLM意図分類 + 決定的サニタイズで 1 入口に統合。設計: docs/unified-chat-design.md。
# **直接編集せず、元 DSL とスクリプトを直して再生成する。**
#
# インポート後に環境へ合わせる箇所:
#  - LLM ノードのモデル（既定は登録フローと同一。任意の LLM に差し替え可）
#  - q_knowledge_retrieval / similar_search の dataset_ids と Reranker 設定
#  - environment_variables の DOCSTORE_URL / DOCSTORE_API_KEY
app:
  description: マニュアルアシスタント（完全 bot）。質問・登録・一括取り込み・重複整理・承認待ち確認を 1 つの入口で受け、LLM 意図分類 +
    決定的サニタイズで自律的に振り分ける。
  icon: 💬
  icon_background: '#D5F5F6'
  mode: advanced-chat
  name: マニュアルアシスタント
  use_icon_as_answer_icon: false
